[package]
name = "wshook"
version = "0.1.0"
edition = "2021"
description = "A bi-directional bridge between WebSockets and HTTP Webhooks with HMAC signing, retries, and broadcast"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/wshook"
readme = "README.md"
keywords = ["websocket", "webhook", "bridge", "hmac", "streaming"]
categories = ["command-line-utilities", "network-programming", "development-tools"]

[lib]
name = "wshook"
path = "src/lib.rs"

[[bin]]
name = "wshook"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
httparse = "1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
